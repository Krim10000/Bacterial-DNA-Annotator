[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-poc-annotator"
version = "1.1.3"
description = "Bacterial genome annotator: GFF, metabolic gaps, evidence, browser and GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Camilo Rojas Bravo", email = "Camilo.Rojas@usach.cl" },
]
keywords = ["bioinformatics", "bacterial-genomics", "genome-annotation", "streamlit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "streamlit>=1.30",
  "py3Dmol>=2.4",
  "stmol>=0.0.9",
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.81",
  "pyrodigal>=3.0",
]

[project.optional-dependencies]
full = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "requests>=2.31",
  "pyyaml>=6.0",
  "ViennaRNA>=2.6",
]
oric = ["orcapy==1.0.1"]
esm = ["torch>=2.0", "fair-esm>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/Krim10000/Bacterial-DNA-Annotator"
Repository = "https://github.com/Krim10000/Bacterial-DNA-Annotator"
Issues = "https://github.com/Krim10000/Bacterial-DNA-Annotator/issues"
Documentation = "https://github.com/Krim10000/Bacterial-DNA-Annotator/blob/v1.0/docs/INSTALL.md"

[project.scripts]
dna-annotate = "webapp.pipeline:main"

[tool.setuptools.packages.find]
include = ["webapp*", "modules*"]

[tool.setuptools.package-data]
webapp = ["locales/*.json", "components/**/*", "samples/*", "demo/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
