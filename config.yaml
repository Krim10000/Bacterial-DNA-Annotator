project_root: .
data:
  raw_dir: data/raw
  tokenizer_dir: data/tokenizer
  processed_dir: data/processed
  taxdump_dir: data/taxdump
  fasta_pattern: '*.fna.gz'
tokenizer:
  vocab_size: 16000
  model_type: bpe
  max_token_length: 12
  min_frequency: 50
  byte_fallback: true
  user_symbols_file: data/tokenizer/user_symbols.txt
  user_symbols:
  - TTGACA
  - TATAAT
  - AGGAGG
  - GGAGG
  - ATG
  - GTG
  - TTG
  - TAA
  - TAG
  - TGA
  - GCGC
  - GCCC
precompute:
  min_genome_length: 1024
  max_n_fraction: 0.1
  n_workers: 4
  dtype_nt: uint8
  dtype_bpe: uint16
  dtype_span: uint32
  min_seq_length: 512
  sp_num_threads: 3
selection:
  cap_per_phylum: 15
  seed: 42
  assembly_level: Complete Genome
  refseq_categories:
  - representative genome
  - reference genome
logging:
  level: INFO
  dir: logs
